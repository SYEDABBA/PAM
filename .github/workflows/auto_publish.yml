name: Publish Episode

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PAM Publisher
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Checking Secrets..."
          if [ -z "$GROQ_API_KEY" ]; then echo "GROQ_API_KEY is EMPTY!"; else echo "GROQ_API_KEY is SET"; fi
          if [ -z "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY is EMPTY!"; else echo "GEMINI_API_KEY is SET"; fi
          python main.py
