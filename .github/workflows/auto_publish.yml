name: PAM Auto Publisher

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install google-generativeai groq playwright requests python-dotenv
          playwright install chromium --with-deps

      - name: Run PAM Publisher
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORAGE_STATE_JSON: ${{ secrets.STORAGE_STATE_JSON }}
          PYTHONPATH: .
        run: |
          python main.py

      - name: Commit and Push Saved Work
        if: always()
        run: |
          git config --global user.name "PAM Bot"
          git config --global user.email "bot@pam.auto"
          git add "my work/*" || true
          git commit -m "Auto-save generated episode to my work folder" || echo "No changes to commit"
          git push
